<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quiz！聖灯祭！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Cute Soft Look -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f2f7f5;
            background-image: radial-gradient(#d3e7ee 15%, transparent 15%), radial-gradient(#fbe3e8 15%, transparent 15%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .pastel-card {
            background: #ffffff;
            border: 4px solid #b8e0d2;
            box-shadow: 0 10px 25px -5px rgba(184, 224, 210, 0.4);
        }

        .pastel-card-back {
            background: #fff5f5;
            border: 4px solid #f6a6b2;
            box-shadow: 0 10px 25px -5px rgba(246, 166, 178, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8e0d2;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header Section -->
    <header class="bg-white/80 backdrop-blur-md border-b-2 border-teal-100 py-3 px-4 shadow-sm sticky top-0 z-10">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">✨</span>
                <h1 class="text-xl md:text-2xl font-extrabold text-teal-700 tracking-wide">
                    Quiz！聖灯祭！
                </h1>
            </div>
            
            <button id="open-editor-btn" class="bg-teal-100 hover:bg-teal-200 text-teal-800 font-bold py-2 px-3.5 rounded-2xl text-xs md:text-sm border border-teal-300 shadow-sm transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-gear text-teal-600"></i>
                <span>問題編集</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center items-center">

        <!-- 3-Category Tabs -->
        <div class="flex w-full bg-white/90 p-1.5 rounded-2xl mb-4 border-2 border-teal-100 shadow-sm gap-1">
            <button id="tab-kids" onclick="switchCategory('kids')" class="flex-1 py-2 text-center font-bold text-xs md:text-sm rounded-xl transition-all duration-300 bg-teal-400 text-white shadow-sm">
                👶 こども
            </button>
            <button id="tab-general" onclick="switchCategory('general')" class="flex-1 py-2 text-center font-bold text-xs md:text-sm rounded-xl transition-all duration-300 text-slate-500 hover:text-teal-600">
                🏯 一般向け
            </button>
            <button id="tab-nursing" onclick="switchCategory('nursing')" class="flex-1 py-2 text-center font-bold text-xs md:text-sm rounded-xl transition-all duration-300 text-slate-500 hover:text-teal-600">
                🩺 看護学生
            </button>
        </div>

        <!-- Progress Bar & Indicator -->
        <div class="w-full mb-3 px-1">
            <div class="flex justify-between items-center text-slate-600 font-bold mb-1 text-xs">
                <span id="progress-text">問題 1 / 10</span>
                <span id="category-badge" class="bg-teal-100 text-teal-800 text-[10px] px-2.5 py-0.5 rounded-full font-extrabold border border-teal-200">こども向け</span>
            </div>
            <div class="w-full bg-slate-200/60 rounded-full h-3 p-0.5">
                <div id="progress-bar" class="bg-gradient-to-r from-teal-300 to-emerald-300 h-2 rounded-full transition-all duration-300" style="width: 10%;"></div>
            </div>
        </div>

        <!-- Flashcard Container -->
        <div class="w-full perspective-1000 my-2 cursor-pointer" onclick="flipCard()">
            <div id="card-inner" class="relative w-full h-72 rounded-3xl transform-style-3d shadow-md transition-transform duration-500">
                
                <!-- Front (Question) -->
                <div class="absolute inset-0 w-full h-full rounded-3xl pastel-card p-6 flex flex-col justify-between backface-hidden">
                    <div class="flex justify-between items-center border-b border-teal-100 pb-2">
                        <span class="text-teal-600 font-extrabold text-xs tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-circle-question"></i> もんだい
                        </span>
                        <span class="text-[11px] text-slate-400 font-bold flex items-center gap-1">
                            <i class="fa-solid fa-hand-pointer"></i> タップでこたえ
                        </span>
                    </div>
                    <div class="flex-1 flex items-center justify-center py-2">
                        <p id="card-question" class="text-lg md:text-xl font-bold text-slate-700 text-center leading-relaxed">
                            読み込み中...
                        </p>
                    </div>
                    <div class="text-center text-[11px] text-teal-500 font-bold">
                        めくってこたえをかくにん くるっ！
                    </div>
                </div>

                <!-- Back (Answer) -->
                <div class="absolute inset-0 w-full h-full rounded-3xl pastel-card-back p-6 flex flex-col justify-between backface-hidden rotate-y-180">
                    <div class="flex justify-between items-center border-b border-rose-100 pb-2">
                        <span class="text-rose-500 font-extrabold text-xs tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-star"></i> こたえ
                        </span>
                        <span class="text-[11px] text-slate-400 font-bold flex items-center gap-1">
                            <i class="fa-solid fa-rotate-left"></i> タップで問題へ
                        </span>
                    </div>
                    <div class="flex-1 flex items-center justify-center py-2">
                        <p id="card-answer" class="text-xl md:text-2xl font-extrabold text-rose-500 text-center leading-relaxed">
                            解答表示
                        </p>
                    </div>
                    <div class="text-center text-[11px] text-rose-400 font-bold">
                        横にスワイプでつぎのもんだいへ
                    </div>
                </div>

            </div>
        </div>

        <!-- Controls / Navigation Buttons -->
        <div class="flex justify-between items-center w-full mt-5 px-1 gap-3">
            <button id="prev-btn" onclick="prevQuestion()" class="flex-1 bg-white hover:bg-slate-50 text-slate-600 font-bold py-3 px-3 rounded-2xl shadow-sm border border-slate-200 transition flex items-center justify-center gap-1.5 text-xs md:text-sm active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-chevron-left text-xs"></i> まえへ
            </button>
            <button id="shuffle-btn" onclick="shuffleAndReset()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold p-3 rounded-2xl shadow-sm border border-amber-200 transition active:scale-95 flex items-center justify-center" title="シャッフル">
                <i class="fa-solid fa-shuffle text-sm"></i>
            </button>
            <button id="next-btn" onclick="nextQuestion()" class="flex-1 bg-teal-400 hover:bg-teal-500 text-white font-extrabold py-3 px-3 rounded-2xl shadow-sm transition flex items-center justify-center gap-1.5 text-xs md:text-sm active:scale-95">
                つぎへ <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-slate-400 text-[11px]">
        Quiz！聖灯祭！ &copy; 2026
    </footer>

    <!-- Editor Modal -->
    <div id="editor-modal" class="fixed inset-0 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-3 z-50 hidden">
        <div class="bg-white w-full max-w-xl rounded-3xl shadow-xl flex flex-col max-h-[90vh] overflow-hidden border-2 border-teal-200">
            
            <!-- Modal Header -->
            <div class="bg-teal-50 p-4 flex justify-between items-center border-b border-teal-100">
                <h2 class="text-base md:text-lg font-bold text-teal-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-teal-600"></i> 問題の編集・作成
                </h2>
                <button onclick="closeModal()" class="bg-white hover:bg-slate-100 text-slate-500 font-bold px-3 py-1 rounded-full text-xs border border-slate-200 transition">
                    とじる
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 overflow-y-auto flex-1 space-y-5">
                
                <!-- Category Select in Editor -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-500">編集するカテゴリを選択：</label>
                    <div class="flex gap-1.5 bg-slate-100 p-1 rounded-2xl">
                        <button id="edit-tab-kids" onclick="setEditTarget('kids')" class="flex-1 py-2 font-bold text-xs rounded-xl transition bg-teal-400 text-white shadow-sm">
                            👶 こども
                        </button>
                        <button id="edit-tab-general" onclick="setEditTarget('general')" class="flex-1 py-2 font-bold text-xs rounded-xl transition text-slate-500">
                            🏯 一般向け
                        </button>
                        <button id="edit-tab-nursing" onclick="setEditTarget('nursing')" class="flex-1 py-2 font-bold text-xs rounded-xl transition text-slate-500">
                            🩺 看護学生
                        </button>
                    </div>
                </div>

                <!-- Form: Add / Edit Question -->
                <div class="bg-teal-50/50 p-3.5 rounded-2xl border border-teal-100 space-y-2.5">
                    <div class="flex justify-between items-center">
                        <span id="form-mode-title" class="font-extrabold text-xs text-teal-800 flex items-center gap-1">
                            <i class="fa-solid fa-plus-circle text-teal-600"></i> 新しい問題を追加
                        </span>
                        <button id="cancel-edit-btn" onclick="cancelEditMode()" class="text-[11px] text-slate-400 underline hidden">
                            キャンセル
                        </button>
                    </div>
                    <div class="space-y-2">
                        <input type="text" id="input-q" placeholder="問題文を入力してください..." class="border border-slate-200 rounded-xl p-2.5 text-xs md:text-sm w-full focus:border-teal-400 outline-none">
                        <input type="text" id="input-a" placeholder="こたえを入力してください..." class="border border-slate-200 rounded-xl p-2.5 text-xs md:text-sm w-full focus:border-teal-400 outline-none">
                        <button id="save-btn" onclick="saveQuestion()" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-check"></i> この内容で保存する
                        </button>
                    </div>
                </div>

                <!-- Existing Question List -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-xs text-slate-600">登録済み問題（<span id="edit-count">0</span>件）</span>
                        <button onclick="resetDefault()" class="text-[11px] text-rose-500 hover:underline">初期状態に戻す</button>
                    </div>
                    <div id="questions-editor-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                        <!-- Dynamic items -->
                    </div>
                </div>

                <!-- CSV File Handling -->
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                    <span class="font-bold text-xs text-slate-600 block"><i class="fa-solid fa-file-csv"></i> CSV入出力</span>
                    <div class="flex gap-2">
                        <label class="flex-1 bg-white hover:bg-slate-100 text-slate-600 font-bold py-2 px-2 rounded-xl text-[11px] border border-slate-200 cursor-pointer text-center shadow-sm">
                            <i class="fa-solid fa-upload"></i> CSV読込
                            <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importCSV(event)">
                        </label>
                        <button onclick="exportCSV()" class="flex-1 bg-white hover:bg-slate-100 text-slate-600 font-bold py-2 px-2 rounded-xl text-[11px] border border-slate-200 text-center shadow-sm">
                            <i class="fa-solid fa-download"></i> CSV保存
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // --- Default Question Sets (Including Kids) ---
        const defaultKids = [
            { q: "人の体の骨の数は、大人はぜんぶでなんこあるかな？", a: "約206こ！" },
            { q: "心ぞうは1分かんに何かいドクドク動いているかな？", a: "約60〜100かい！" },
            { q: "ごはんを食べたあと、おなかの中で食べものを消化してくれる場所は？", a: "胃（い）" },
            { q: "息（いき）をすうときに、さんそを取りこむ体のばしょは？", a: "肺（はい）" },
            { q: "血液（けつえき）のなかで、バイキンとたたかってくれるのは何球？", a: "白血球（はっけっきゅう）" },
            { q: "手あらいは、なん秒以上しっかり洗うとバイキンが落ちるかな？", a: "30秒以上！" },
            { q: "体のなかで、いちばん大きなぞうき（臓器）はどこかな？", a: "肝臓（かんぞう）" },
            { q: "人の体は、半分以上が「なに」でできているかな？", a: "みず（水分）" }
        ];

        const defaultGeneral = [
            { q: "聖灯祭の「聖灯」の正しい読み方は？", a: "せいとう" },
            { q: "ナイチンゲールの生誕の国はどこ？", a: "イギリス（フィレンツェ生まれ）" },
            { q: "人間が呼吸で主に取り入れている気体は？", a: "酸素" },
            { q: "血液の中で酸素を全身に運ぶ役割を持つ細胞は？", a: "赤血球" },
            { q: "心臓にある部屋の数は全部でいくつ？", a: "4つ（右心房・右心室・左心房・左心室）" },
            { q: "一般的な成人の平熱範囲はおよそ何度？", a: "36.5℃〜37.1℃程度" },
            { q: "AED（自動体外式除細動器）の主な目的は？", a: "心臓の細動（けいれん）を電気ショックで取り除く" },
            { q: "脈拍を測る際によく使われる手首の動脈は？", a: "橈骨動脈（とうこつどうみゃく）" }
        ];

        const defaultNursing = [
            { q: "バイタルサインの5大要素とは？", a: "体温・脈拍・呼吸・血圧・（意識レベル/痛み）" },
            { q: "成人における1日の標準的な尿量は？", a: "1,000〜1,500ml" },
            { q: "対光反射に関与する脳神経は第何脳神経？", a: "動眼神経（第III脳神経）" },
            { q: "褥瘡（じょくそう）発生リスクの評価スケールで有名なものは？", a: "ブレーデンスケール" },
            { q: "1回換気量の成人の標準値はおよそいくら？", a: "約500ml" },
            { q: "ジャパン・コーマ・スケール（JCS）で「刺激しても覚醒しない」の範囲は？", a: "3桁（100〜300）" },
            { q: "聴診器のベル型が得意とする音域は？", a: "低音域（心音のIII音・IV音など）" }
        ];

        // --- Application State ---
        let currentCategory = 'kids';
        let questionBank = { kids: [], general: [], nursing: [] };
        let activeQuiz = [];
        let currentIndex = 0;
        let isFlipped = false;
        let currentEditingCategory = 'kids';
        let editingIndex = -1;

        // --- Init ---
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            switchCategory('kids');
            setupSwipe();
        });

        function loadFromLocalStorage() {
            const savedKids = localStorage.getItem('quiz_kids');
            const savedGeneral = localStorage.getItem('quiz_general');
            const savedNursing = localStorage.getItem('quiz_nursing');

            questionBank.kids = savedKids ? JSON.parse(savedKids) : [...defaultKids];
            questionBank.general = savedGeneral ? JSON.parse(savedGeneral) : [...defaultGeneral];
            questionBank.nursing = savedNursing ? JSON.parse(savedNursing) : [...defaultNursing];
        }

        function saveToLocalStorage() {
            localStorage.setItem('quiz_kids', JSON.stringify(questionBank.kids));
            localStorage.setItem('quiz_general', JSON.stringify(questionBank.general));
            localStorage.setItem('quiz_nursing', JSON.stringify(questionBank.nursing));
        }

        // --- Category Navigation ---
        function switchCategory(cat) {
            currentCategory = cat;
            
            const btnKids = document.getElementById('tab-kids');
            const btnGen = document.getElementById('tab-general');
            const btnNurs = document.getElementById('tab-nursing');
            const badge = document.getElementById('category-badge');

            const activeStyle = "flex-1 py-2 text-center font-bold text-xs md:text-sm rounded-xl transition-all duration-300 bg-teal-400 text-white shadow-sm";
            const inactiveStyle = "flex-1 py-2 text-center font-bold text-xs md:text-sm rounded-xl transition-all duration-300 text-slate-500 hover:text-teal-600";

            btnKids.className = cat === 'kids' ? activeStyle : inactiveStyle;
            btnGen.className = cat === 'general' ? activeStyle : inactiveStyle;
            btnNurs.className = cat === 'nursing' ? activeStyle : inactiveStyle;

            if (cat === 'kids') badge.innerText = "こども向け";
            else if (cat === 'general') badge.innerText = "一般向け";
            else badge.innerText = "看護学生向け";

            shuffleAndReset();
        }

        function shuffleAndReset() {
            const pool = [...questionBank[currentCategory]];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            activeQuiz = pool.slice(0, 10);
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            isFlipped = false;
            document.getElementById('card-inner').classList.remove('rotate-y-180');

            if (activeQuiz.length === 0) {
                document.getElementById('card-question').innerText = "問題がありません。「問題編集」から追加してください。";
                document.getElementById('card-answer').innerText = "なし";
                document.getElementById('progress-text').innerText = "問題 0 / 0";
                document.getElementById('progress-bar').style.width = "0%";
                return;
            }

            const current = activeQuiz[currentIndex];
            document.getElementById('card-question').innerText = current.q;
            document.getElementById('card-answer').innerText = current.a;

            const total = activeQuiz.length;
            document.getElementById('progress-text').innerText = `問題 ${currentIndex + 1} / ${total}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / total) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === activeQuiz.length - 1;
        }

        function flipCard() {
            if (activeQuiz.length === 0) return;
            isFlipped = !isFlipped;
            const card = document.getElementById('card-inner');
            if (isFlipped) card.classList.add('rotate-y-180');
            else card.classList.remove('rotate-y-180');
        }

        function nextQuestion() {
            if (currentIndex < activeQuiz.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function setupSwipe() {
            let touchStartX = 0;
            let touchEndX = 0;
            const card = document.getElementById('card-inner');

            card.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            card.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 50) {
                    if (diff < 0) nextQuestion();
                    else prevQuestion();
                }
            }, false);
        }

        // --- Editor Logic (with Inline Edit) ---
        const editorModal = document.getElementById('editor-modal');
        document.getElementById('open-editor-btn').addEventListener('click', () => {
            setEditTarget(currentCategory);
            editorModal.classList.remove('hidden');
        });

        function closeModal() {
            cancelEditMode();
            editorModal.classList.add('hidden');
            shuffleAndReset();
        }

        function setEditTarget(cat) {
            currentEditingCategory = cat;
            cancelEditMode();

            const btnKids = document.getElementById('edit-tab-kids');
            const btnGen = document.getElementById('edit-tab-general');
            const btnNurs = document.getElementById('edit-tab-nursing');

            const activeStyle = "flex-1 py-2 font-bold text-xs rounded-xl transition bg-teal-400 text-white shadow-sm";
            const inactiveStyle = "flex-1 py-2 font-bold text-xs rounded-xl transition text-slate-500";

            btnKids.className = cat === 'kids' ? activeStyle : inactiveStyle;
            btnGen.className = cat === 'general' ? activeStyle : inactiveStyle;
            btnNurs.className = cat === 'nursing' ? activeStyle : inactiveStyle;

            renderEditorList();
        }

        function renderEditorList() {
            const list = questionBank[currentEditingCategory];
            const container = document.getElementById('questions-editor-list');
            document.getElementById('edit-count').innerText = list.length;
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-xs text-slate-400 font-bold">登録されている問題がありません。</div>`;
                return;
            }

            list.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200 gap-2";
                row.innerHTML = `
                    <div class="flex-1 overflow-hidden">
                        <div class="font-bold text-xs text-slate-700 truncate">${idx + 1}. ${escapeHtml(item.q)}</div>
                        <div class="text-[11px] text-rose-500 font-bold truncate">答: ${escapeHtml(item.a)}</div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="startEdit(${idx})" class="bg-teal-50 text-teal-600 hover:bg-teal-100 p-1.5 rounded-lg text-xs font-bold transition">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteQuestion(${idx})" class="bg-rose-50 text-rose-500 hover:bg-rose-100 p-1.5 rounded-lg text-xs font-bold transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function saveQuestion() {
            const qInput = document.getElementById('input-q');
            const aInput = document.getElementById('input-a');
            const q = qInput.value.trim();
            const a = aInput.value.trim();

            if (!q || !a) {
                alert('問題文と答えの両方を入力してください。');
                return;
            }

            if (editingIndex >= 0) {
                questionBank[currentEditingCategory][editingIndex] = { q, a };
            } else {
                questionBank[currentEditingCategory].push({ q, a });
            }

            saveToLocalStorage();
            cancelEditMode();
            renderEditorList();
        }

        function startEdit(idx) {
            editingIndex = idx;
            const target = questionBank[currentEditingCategory][idx];
            document.getElementById('input-q').value = target.q;
            document.getElementById('input-a').value = target.a;
            
            document.getElementById('form-mode-title').innerHTML = `<i class="fa-solid fa-pen text-teal-600"></i> 問題を修正中 (No.${idx + 1})`;
            document.getElementById('save-btn').innerHTML = `<i class="fa-solid fa-check"></i> 修正を保存する`;
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        function cancelEditMode() {
            editingIndex = -1;
            document.getElementById('input-q').value = '';
            document.getElementById('input-a').value = '';
            document.getElementById('form-mode-title').innerHTML = `<i class="fa-solid fa-plus-circle text-teal-600"></i> 新しい問題を追加`;
            document.getElementById('save-btn').innerHTML = `<i class="fa-solid fa-check"></i> この内容で保存する`;
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function deleteQuestion(idx) {
            if (confirm('この問題を削除しますか？')) {
                questionBank[currentEditingCategory].splice(idx, 1);
                saveToLocalStorage();
                if (editingIndex === idx) cancelEditMode();
                renderEditorList();
            }
        }

        function resetDefault() {
            if (confirm('初期問題セットに戻しますか？（追加・編集した内容はリセットされます）')) {
                if (currentEditingCategory === 'kids') questionBank.kids = [...defaultKids];
                else if (currentEditingCategory === 'general') questionBank.general = [...defaultGeneral];
                else questionBank.nursing = [...defaultNursing];
                
                saveToLocalStorage();
                cancelEditMode();
                renderEditorList();
            }
        }

        // --- CSV Operations ---
        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split(/\r\n|\n/);
                const imported = [];
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const q = parts[0].trim().replace(/^"(.*)"$/, '$1');
                        const a = parts.slice(1).join(',').trim().replace(/^"(.*)"$/, '$1');
                        if (q && a) imported.push({ q, a });
                    }
                });

                if (imported.length > 0) {
                    if (confirm(`${imported.length}件を検出しました。追加しますか？（キャンセルで全上書き）`)) {
                        questionBank[currentEditingCategory] = [...questionBank[currentEditingCategory], ...imported];
                    } else {
                        questionBank[currentEditingCategory] = imported;
                    }
                    saveToLocalStorage();
                    renderEditorList();
                    alert('読み込み完了しました！');
                }
            };
            reader.readAsText(file, 'UTF-8');
            e.target.value = '';
        }

        function exportCSV() {
            const list = questionBank[currentEditingCategory];
            if (list.length === 0) return alert('保存するデータがありません。');

            let csv = "\uFEFF";
            list.forEach(item => {
                csv += `"${item.q.replace(/"/g, '""')}","${item.a.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Quiz_聖灯祭_${currentEditingCategory}.csv`;
            a.click();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
